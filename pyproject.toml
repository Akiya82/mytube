[project]
name = "mytube"
version = "0.1.0"
description = "Self-hosted progressive-MP4 delivery for VRChat AVPro and browser playback"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141,<0.150",
    "uvicorn[standard]",
    "asyncpg",
    "alembic",
    "sqlalchemy",
    "boto3",
    "pydantic-settings",
    "python-slugify",
    "typer",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker",
]
