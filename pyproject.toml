[project]
name = "mytube"
# The release is the dated image tag; the build backend only requires this field.
version = "0.0.0"
description = "Self-hosted progressive-MP4 delivery for VRChat AVPro and browser playback"
requires-python = ">=3.13"
license = { text = "MIT" }
# Only what both the interface and the converter genuinely import: boto3
# (both upload), pydantic-settings (both read their own settings), httpx
# (the converter's client -- also already used by orchestrator/cli/
# cache_warm.py, so left shared rather than duplicated across extras).
dependencies = [
    "boto3",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
# The interface: the web framework, the server, the database driver, the
# migration tool (and sqlalchemy, which alembic's own env.py logging
# config pulls in), the template engine, the form parser, the password
# hasher, the slug library and the command-line framework. None of these
# are imported anywhere mytube_media or (eventually) worker would import.
api = [
    "fastapi>=0.141,<0.150",
    "uvicorn[standard]",
    "asyncpg",
    "alembic",
    # The asyncio extra, not bare sqlalchemy: migrations/env.py drives the
    # migration through an async engine, and SQLAlchemy's async layer needs
    # greenlet to bridge it to the sync DBAPI calls underneath. Bare
    # sqlalchemy pulls greenlet in through a platform_machine marker that
    # lists aarch64, x86_64 and AMD64 but not "arm64" -- so it arrived as a
    # transitive accident on the Windows machine this was first developed
    # on and does not on an Apple-silicon one. The extra requires it
    # unconditionally. Worth pinning down because the symptom hides the
    # cause: `alembic upgrade head` exits non-zero, every database-backed
    # test errors out at once, and the missing package is named several
    # frames down a subprocess traceback that reads like a dead database.
    "sqlalchemy[asyncio]",
    "python-slugify",
    "typer",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1,<26",
    # Filename recognition and language resolution both run once, at the
    # moment the operator confirms a folder or a file, and what they decide
    # is written to the catalog then -- the converter never re-parses a
    # filename or re-resolves a language, it only re-probes the media it
    # already has. The CLDR data behind the four packages below is ~24 MB;
    # keeping all of them on the interface side is what keeps that weight
    # out of the GPU host's image. Reversible by moving the import later,
    # not a schema or protocol decision.
    "anitopy>=2.1,<3",
    "guessit>=4.4,<5",
    "langcodes>=3.5,<4",
    "language_data>=1.4,<2",
]
# The converter, beyond the shared set above. Empty -- the worker package
# now exists (settings, HTTP client, VRAM check, storage client, the
# claim-probe-build-run-upload-report loop) and imports nothing beyond
# what api and mytube_media already share: httpx for the HTTP client,
# boto3 for its own scoped storage credential, pydantic-settings for its
# own settings class. No web framework, no database driver, ever.
worker = []
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff==0.16.7",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mytube_media*", "orchestrator*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
exclude = ["*.md"]
