name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
  - type: textarea
    id: idea
    attributes:
      label: Any idea how it could work?
