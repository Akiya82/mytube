name: release

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the project and the pinned linter
        run: pip install -e ".[api,worker,dev]" "ruff==0.16.7"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Run the suite
        env:
          MYTUBE_REQUIRE_INTEGRATION: "1"
        # The image builds below check the licence file inside each image, so
        # the tests that build the images are left out here.
        run: python -m pytest -q -m "not image_build"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the interface image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/akiya82/mytube:${{ github.ref_name }}
          cache-from: type=gha,scope=api
      - name: Build the converter image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: ghcr.io/akiya82/mytube-worker:${{ github.ref_name }}
          cache-from: type=gha,scope=worker
      - name: Check the ffmpeg licence is inside both images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for image in ghcr.io/akiya82/mytube ghcr.io/akiya82/mytube-worker; do
            docker run --rm --entrypoint test "$image:$TAG" -f /usr/share/licenses/ffmpeg/LICENSE.txt
          done
      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push both images under the dated tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker push "ghcr.io/akiya82/mytube:$TAG"
          docker push "ghcr.io/akiya82/mytube-worker:$TAG"
      - name: Move latest for both images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create -t ghcr.io/akiya82/mytube:latest "ghcr.io/akiya82/mytube:$TAG"
          docker buildx imagetools create -t ghcr.io/akiya82/mytube-worker:latest "ghcr.io/akiya82/mytube-worker:$TAG"
