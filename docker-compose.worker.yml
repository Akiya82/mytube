# The converter's own compose file (D-112) -- run on the machine that has
# the card, not a profile inside docker-compose.yml. That file is how
# somebody outside this project brings the service up on its own, and
# this file must not complicate that path in any way; it keeps working
# exactly as it does today, untouched by this one.
#
# Bring the converter up with:
#   docker compose --env-file .env.worker -f docker-compose.worker.yml up -d --build
#
# The env-file flag is not optional: the values below come from that file,
# and the tool only reads a file named .env by default -- without the flag
# every required variable below is missing and the command fails.
#
# One service. No published ports -- the converter listens on nothing; it
# only ever calls out to the service over MYTUBE_ORCHESTRATOR_URL and to
# storage over MYTUBE_S3_ENDPOINT.
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # This service is given names, one at a time -- no inherited service
    # environment. It gets MYTUBE_ORCHESTRATOR_URL, MYTUBE_WORKER_TOKEN
    # (the same value the service's own MYTUBE_WORKER_TOKEN carries -- one
    # shared credential), MYTUBE_S3_ENDPOINT / MYTUBE_S3_BUCKET /
    # MYTUBE_S3_REGION (the same storage, bucket and region the service
    # signs with -- a region that differs from the one the storage was
    # set up with is refused as a bad signature at upload time, after the
    # card has already done the work), and the converter's own storage
    # credential MYTUBE_WORKER_S3_KEY / MYTUBE_WORKER_S3_SECRET -- its own
    # variable names, never the service's own S3 key/secret pair (see
    # `.env.example` for that pair's own names). Deliberately not among
    # these names: the service's own storage key, its database URL, its
    # signing secret and its share password -- a leak from this host
    # hands out none of them (D-115). This list has
    # to stay equal to what worker/settings.py's WorkerSettings declares
    # (that module's own docstring is the source of truth); a field added
    # there without a matching entry here fails
    # tests/test_worker_deployment.py.
    environment:
      MYTUBE_ORCHESTRATOR_URL: ${MYTUBE_ORCHESTRATOR_URL:?}
      MYTUBE_WORKER_TOKEN: ${MYTUBE_WORKER_TOKEN:?}
      MYTUBE_S3_ENDPOINT: ${MYTUBE_S3_ENDPOINT:?}
      MYTUBE_S3_BUCKET: ${MYTUBE_S3_BUCKET:-mytube}
      MYTUBE_S3_REGION: ${MYTUBE_S3_REGION:-mytube}
      MYTUBE_WORKER_S3_KEY: ${MYTUBE_WORKER_S3_KEY:?}
      MYTUBE_WORKER_S3_SECRET: ${MYTUBE_WORKER_S3_SECRET:?}
      MYTUBE_WORKER_NAME: ${MYTUBE_WORKER_NAME:-}
      MYTUBE_WORKER_VRAM_MIN_MIB: ${MYTUBE_WORKER_VRAM_MIN_MIB:-1536}
      MYTUBE_WORKER_POLL_SECONDS: ${MYTUBE_WORKER_POLL_SECONDS:-5.0}
      MYTUBE_WORKER_MAX_OUTPUT_WIDTH: ${MYTUBE_WORKER_MAX_OUTPUT_WIDTH:-1920}
      # Exactly what the image itself also sets -- repeated here (D-144)
      # because the host's container runtime reads this from the
      # container's own environment at run time, not from the image's
      # baked-in default alone, on every compose stack that sets its own
      # environment: block. All three, spelled this way: `utility` is
      # what injects the vendor's own query tool (nvidia-smi), and
      # worker/gpu.py's free-memory check runs that tool on every single
      # poll -- trim this to the two that sound like an encoder's own
      # business and the floor check (D-113) fails permanently.
      NVIDIA_DRIVER_CAPABILITIES: "video,compute,utility"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # The same relative root the service sees, read-only -- a stored
      # relative source_path has to mean the same file on both machines.
      # This compose file does not mount the share itself (unlike the
      # service's own docker-compose.yml, which owns the CIFS mount): the
      # converter host is expected to already have the same network share
      # reachable and mounted by the host's own means, bind-mounted in
      # here. See SETUP.md for how the GPU host's own mount is arranged.
      - ${MYTUBE_SHARE_HOST_PATH:-./share}:/share:ro
      # Scratch space for the encoder's own output and the +faststart
      # rewrite that follows it -- a bind mount onto a disk with room for
      # a large file plus its rewrite (D-114 names a spinning disk on the
      # real deployment host; any disk with enough free space works for
      # an outside user's own machine).
      - ${MYTUBE_WORKER_SCRATCH_PATH:-./worker-scratch}:/work
    restart: unless-stopped
